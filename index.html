<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소소숲 작심삼일 33번 챌린지</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1D9E75">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f5f7f5; color: #1a1a1a;
    min-height: 100vh; padding: 24px 16px 48px;
  }
  .page-header { text-align: center; margin-bottom: 20px; }
  .page-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .page-header p { font-size: 13px; color: #888; }

  .sync-status { text-align: center; font-size: 12px; margin-bottom: 14px; height: 18px; color: #aaa; }
  .sync-status.connected { color: #1D9E75; }
  .sync-status.error { color: #e24b4a; }
  .sync-status.saving { color: #FAC775; }

  /* ── 참가자 선택 화면 ── */
  .select-screen { max-width: 400px; margin: 0 auto; }
  .select-title { text-align: center; font-size: 14px; color: #888; margin-bottom: 20px; }
  .name-buttons {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 24px;
  }
  .name-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 18px 8px; background: #fff; border: 1px solid #e8e8e8;
    border-radius: 16px; cursor: pointer; font-family: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04); transition: all 0.15s;
    aspect-ratio: 1;
  }
  .name-btn:hover { border-color: #1D9E75; background: #f0fbf7; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(29,158,117,0.15); }
  .name-btn .btn-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .name-btn .btn-name { font-size: 14px; font-weight: 600; color: #1a1a1a; text-align: center; }
  .all-view-btn {
    display: block; width: 100%; padding: 11px;
    font-size: 13px; color: #888; border: 1.5px dashed #d0d0d0;
    border-radius: 12px; background: transparent; cursor: pointer;
    font-family: inherit; transition: all 0.15s; text-align: center;
  }
  .all-view-btn:hover { background: #f0fbf7; color: #1D9E75; border-color: #1D9E75; }

  /* ── 체크표 화면 ── */
  .check-screen { display: none; }
  .back-bar {
    display: flex; align-items: center; gap: 10px;
    max-width: 760px; margin: 0 auto 20px;
  }
  .back-btn {
    padding: 6px 14px; font-size: 13px; border: 1.5px solid #d0d0d0;
    border-radius: 20px; cursor: pointer; color: #888; background: #fff;
    font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .back-btn:hover { border-color: #1D9E75; color: #1D9E75; }
  .back-bar-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }

  /* 세트 진행 바 */
  .set-progress {
    max-width: 760px; margin: 0 auto 14px;
    background: #fff; border-radius: 14px; padding: 12px 16px;
    border: 1px solid #e8e8e8;
  }
  .set-progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #aaa; margin-bottom: 7px;
  }
  .set-progress-label strong { color: #1a1a1a; font-size: 13px; }
  .set-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .set-fill { height: 100%; border-radius: 4px; background: #1D9E75; transition: width 0.4s ease; }

  /* 세트 탭 */
  .set-tabs-wrap {
    max-width: 760px; margin: 0 auto 16px;
  }
  .set-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .set-tabs::-webkit-scrollbar { display: none; }
  .set-tab {
    padding: 5px 13px; font-size: 12px; border: 1.5px solid #d0d0d0;
    border-radius: 20px; cursor: pointer; color: #888; background: #fff;
    font-family: inherit; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .set-tab.active { background: #1D9E75; color: #fff; border-color: #1D9E75; font-weight: 600; }
  .set-tab.done { border-color: #1D9E75; color: #1D9E75; background: #f0fbf7; }

  .missions-legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .mission-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px; }
  .m1 { background: #E1F5EE; color: #0F6E56; }
  .m2 { background: #E6F1FB; color: #185FA5; }
  .m3 { background: #FAEEDA; color: #854F0B; }
  .m4 { background: #FBEAF0; color: #993556; }

  .summary-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .summary-card {
    background: #fff; border-radius: 12px; padding: 10px 20px;
    font-size: 12px; color: #888; text-align: center; border: 1px solid #eee; min-width: 80px;
  }
  .summary-card strong { display: block; font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }

  .participants-grid { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin: 0 auto; }
  .participant-card {
    background: #fff; border-radius: 16px; padding: 14px 16px;
    border: 1px solid #e8e8e8; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .participant-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .participant-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .custom-label { font-size: 11px; color: #aaa; margin-top: 1px; }
  .status-badge { margin-left: auto; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }
  .status-success { background: #E1F5EE; color: #0F6E56; }
  .status-fail    { background: #FCEBEB; color: #A32D2D; }
  .status-ongoing { background: #F5F5F5; color: #666; }

  .check-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .check-table th { font-size: 11px; color: #aaa; font-weight: 500; text-align: center; padding: 2px 0 7px; }
  .check-table td { text-align: center; padding: 3px; vertical-align: middle; }
  .icon-cell { text-align: left !important; padding-right: 8px !important; white-space: nowrap; font-size: 15px; line-height: 1; }

  .check-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1.5px solid #d8d8d8; background: #fff;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.12s; position: relative;
  }
  .check-btn:hover { border-color: #1D9E75; background: #f0fbf7; }
  .check-btn.checked { background: #1D9E75; border-color: #1D9E75; }
  .check-btn.checked::after {
    content: ''; display: block; width: 6px; height: 10px;
    border: 2px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg) translateY(-1px);
  }

  .indicator-cell { padding-top: 5px !important; }
  .day-dot { width: 32px; height: 5px; border-radius: 3px; margin: 0 auto; background: #eee; transition: background 0.2s; }
  .day-dot.done    { background: #1D9E75; }
  .day-dot.partial { background: #FAC775; }

  .bar-section { margin-top: 8px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 5px; }
  .bar-track { height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; background: #1D9E75; transition: width 0.35s ease; }
  .bar-fill.partial { background: #FAC775; }

  /* 전체 세트 현황 도트 */
  .sets-overview {
    max-width: 760px; margin: 0 auto 16px;
    background: #fff; border-radius: 14px; padding: 12px 16px;
    border: 1px solid #e8e8e8;
  }
  .sets-overview-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
  .sets-dots { display: flex; flex-wrap: wrap; gap: 5px; }
  .set-dot {
    width: 16px; height: 16px; border-radius: 4px; background: #eee;
    cursor: pointer; transition: all 0.12s; position: relative;
  }
  .set-dot.success { background: #1D9E75; }
  .set-dot.partial { background: #FAC775; }
  .set-dot.active  { outline: 2px solid #1D9E75; outline-offset: 1px; }

  .add-btn {
    display: block; width: 100%; max-width: 760px; margin: 14px auto 0;
    padding: 10px; font-size: 13px; color: #aaa;
    border: 1.5px dashed #d0d0d0; border-radius: 12px;
    background: transparent; cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .add-btn:hover { background: #f5f7f5; color: #1D9E75; border-color: #1D9E75; }
  .loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

  @media (max-width: 480px) {
    .icon-cell { font-size: 13px; padding-right: 4px !important; }
    .check-btn { width: 28px; height: 28px; }
    .day-dot { width: 28px; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>🌿 소소숲 작심삼일 33번</h1>
  <p>작심삼일 33번 = 100일 · 3일을 완주하면 한 세트 성공! 🔥</p>
</div>

<div class="sync-status" id="syncStatus">● 데이터 불러오는 중...</div>
<div id="loadingMsg" class="loading">데이터 불러오는 중... ☁️</div>

<!-- 참가자 선택 화면 -->
<div class="select-screen" id="selectScreen" style="display:none">
  <p class="select-title">내 이름을 선택해주세요</p>
  <div class="name-buttons" id="nameButtons"></div>
  <button class="all-view-btn" onclick="showAllView()">👀 전체 보기</button>
</div>

<!-- 체크표 화면 -->
<div class="check-screen" id="checkScreen">
  <div class="back-bar">
    <button class="back-btn" onclick="goBack()">← 뒤로</button>
    <span class="back-bar-title" id="backBarTitle"></span>
  </div>

  <!-- 전체 진행 바 -->
  <div class="set-progress" id="setProgress" style="display:none">
    <div class="set-progress-label">
      <span>전체 진행률</span>
      <strong id="progressText"></strong>
    </div>
    <div class="set-track"><div class="set-fill" id="setFill"></div></div>
  </div>

  <!-- 전체 세트 도트 현황 -->
  <div class="sets-overview" id="setsOverview" style="display:none">
    <div class="sets-overview-title">33세트 전체 현황 (클릭하면 해당 세트로 이동)</div>
    <div class="sets-dots" id="setsDots"></div>
  </div>

  <!-- 세트 탭 -->
  <div class="set-tabs-wrap">
    <div class="set-tabs" id="setTabs"></div>
  </div>

  <div class="missions-legend">
    <span class="mission-tag m1">💧💊 물+영양제</span>
    <span class="mission-tag m2">🚶 30분 걷기</span>
    <span class="mission-tag m3">📝 지출 기록</span>
    <span class="mission-tag m4">⭐ 개인 미션</span>
  </div>

  <div class="summary-row" id="summaryRow"></div>
  <div class="participants-grid" id="participantsGrid"></div>
  <button class="add-btn" id="addBtn" style="display:none" onclick="addParticipant()">+ 참가자 추가</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxn3o-gQa2j45q3t9QHCy5KvdGLig-8TUw7dwGEd4nPPgfElalMYM-vpijjucDer-wj/exec';
const MISSION_ICONS = ['💧💊','🚶','📝','⭐'];
const MISSION_KEYS = ['m0','m1','m2','m3'];
const MISSION_NAMES = ['물+영양제','30분 걷기','지출 기록'];
const DAYS = ['Day 1','Day 2','Day 3'];
const TOTAL_SETS = 33;
const SETS = Array.from({length: TOTAL_SETS}, (_,i) => `${i+1}세트`);
const COLORS = [
  {bg:'#E1F5EE',text:'#0F6E56'},{bg:'#E6F1FB',text:'#185FA5'},
  {bg:'#FAEEDA',text:'#854F0B'},{bg:'#FBEAF0',text:'#993556'},
  {bg:'#F1EFE8',text:'#5F5E5A'},{bg:'#FAECE7',text:'#993C1D'},
  {bg:'#EAF3DE',text:'#3B6D11'},{bg:'#EEEDFE',text:'#3C3489'},
];

const START_DATE = new Date('2026-05-13');
function calcCurrentSet() {
  const diff = Math.floor((new Date() - START_DATE) / (1000*60*60*24*3));
  return Math.min(Math.max(diff, 0), TOTAL_SETS - 1);
}

let currentSet = calcCurrentSet();
let participants = [];
let checksData = {};
let currentView = 'select';
let selectedPi = -1;

function setStatus(msg, cls) {
  const el = document.getElementById('syncStatus');
  el.textContent = '● ' + msg;
  el.className = 'sync-status ' + (cls||'');
}
function apiFetch(p) { return fetch(SCRIPT_URL+'?'+new URLSearchParams(p)).then(r=>r.json()); }
function apiPost(d) { return fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()); }

async function loadData() {
  try {
    const [pRes, cRes] = await Promise.all([
      apiFetch({action:'getParticipants'}),
      apiFetch({action:'getChecks'})
    ]);
    participants = pRes.participants || [];
    checksData = cRes.checks || {};
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('selectScreen').style.display = 'block';
    setStatus('연결됨 ✓','connected');
    renderSelectScreen();
  } catch(e) {
    setStatus('연결 실패 — 잠시 후 새로고침 해주세요','error');
    document.getElementById('loadingMsg').textContent = '❌ 연결 실패. 잠시 후 새로고침 해주세요.';
  }
}

// 체크 헬퍼
function getCheck(pid, set, day, mi) {
  const row = checksData[`${pid}_${SETS[set]}_${DAYS[day]}`];
  return row ? !!row[MISSION_KEYS[mi]] : false;
}
function isDayDone(pid, set, day) {
  const row = checksData[`${pid}_${SETS[set]}_${DAYS[day]}`];
  return row ? [row.m0,row.m1,row.m2,row.m3].filter(Boolean).length >= 3 : false;
}
function isSetSuccess(pid, set) {
  return DAYS.every((_,di) => isDayDone(pid, set, di));
}
function isSetAny(pid, set) {
  return DAYS.some((_,di) => {
    const row = checksData[`${pid}_${SETS[set]}_${DAYS[di]}`];
    return row && [row.m0,row.m1,row.m2,row.m3].some(Boolean);
  });
}

// 참가자 선택 화면
function renderSelectScreen() {
  document.getElementById('nameButtons').innerHTML = participants.map((p,pi) => {
    const col = COLORS[pi%COLORS.length];
    return `<button class="name-btn" onclick="showMyView(${pi})">
      <div class="btn-avatar" style="background:${col.bg};color:${col.text}">${p.name.slice(0,1)}</div>
      <div class="btn-name">${p.name}</div>
    </button>`;
  }).join('');
}

function showMyView(pi) {
  selectedPi = pi; currentView = 'mine';
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('checkScreen').style.display = 'block';
  document.getElementById('backBarTitle').textContent = participants[pi].name + '의 체크표';
  document.getElementById('addBtn').style.display = 'none';
  document.getElementById('setProgress').style.display = 'block';
  document.getElementById('setsOverview').style.display = 'block';
  renderCheckScreen();
}

function showAllView() {
  selectedPi = -1; currentView = 'all';
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('checkScreen').style.display = 'block';
  document.getElementById('backBarTitle').textContent = '전체 참가자 보기';
  document.getElementById('addBtn').style.display = 'block';
  document.getElementById('setProgress').style.display = 'none';
  document.getElementById('setsOverview').style.display = 'none';
  renderCheckScreen();
}

function goBack() {
  currentView = 'select';
  document.getElementById('checkScreen').style.display = 'none';
  document.getElementById('selectScreen').style.display = 'block';
  renderSelectScreen();
}

function setSet(s) { currentSet = s; renderCheckScreen(); }

function renderCheckScreen() {
  renderSetTabs();
  renderProgress();
  renderSetsDots();
  renderSummary();
  renderParticipants();
}

function renderSetTabs() {
  const tabs = document.getElementById('setTabs');
  tabs.innerHTML = SETS.map((s,i) => {
    const p = currentView === 'mine' ? participants[selectedPi] : null;
    const success = p ? isSetSuccess(p.id, i) : false;
    const cls = i===currentSet ? 'active' : success ? 'done' : '';
    return `<button class="set-tab ${cls}" onclick="setSet(${i})">${s}</button>`;
  }).join('');
  // 현재 탭으로 스크롤
  setTimeout(() => {
    const active = tabs.querySelector('.set-tab.active');
    if(active) active.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }, 50);
}

function renderProgress() {
  if(currentView !== 'mine') return;
  const p = participants[selectedPi];
  const successCount = SETS.filter((_,i) => isSetSuccess(p.id, i)).length;
  const pct = Math.round(successCount / TOTAL_SETS * 100);
  document.getElementById('progressText').textContent = `${successCount}세트 성공 / 33세트`;
  document.getElementById('setFill').style.width = pct + '%';
}

function renderSetsDots() {
  if(currentView !== 'mine') return;
  const p = participants[selectedPi];
  document.getElementById('setsDots').innerHTML = SETS.map((_,i) => {
    const success = isSetSuccess(p.id, i);
    const any = isSetAny(p.id, i);
    const cls = success ? 'success' : any ? 'partial' : '';
    const active = i === currentSet ? 'active' : '';
    return `<div class="set-dot ${cls} ${active}" onclick="setSet(${i})" title="${i+1}세트"></div>`;
  }).join('');
}

function renderSummary() {
  const list = currentView === 'mine' ? [participants[selectedPi]] : participants;
  if(currentView === 'mine') {
    const p = list[0];
    const setDone = DAYS.filter((_,di) => isDayDone(p.id, currentSet, di)).length;
    const totalSuccess = SETS.filter((_,i) => isSetSuccess(p.id, i)).length;
    const setStatus = isSetSuccess(p.id, currentSet) ? '🎉 세트 성공!' : setDone > 0 ? `${setDone}일 완료` : '화이팅!';
    document.getElementById('summaryRow').innerHTML = `
      <div class="summary-card"><strong>${totalSuccess}번</strong>작심삼일 성공</div>
      <div class="summary-card"><strong>${TOTAL_SETS - totalSuccess}번</strong>남은 도전</div>
      <div class="summary-card"><strong>${setStatus}</strong>이번 세트</div>
    `;
  } else {
    const successCount = list.filter(p => isSetSuccess(p.id, currentSet)).length;
    const rate = list.length > 0 ? Math.round(list.reduce((a,p) =>
      a + DAYS.filter((_,di) => isDayDone(p.id, currentSet, di)).length, 0) / (list.length * 3) * 100) : 0;
    document.getElementById('summaryRow').innerHTML = `
      <div class="summary-card"><strong>${list.length}명</strong>참가자</div>
      <div class="summary-card"><strong>${successCount}명</strong>이번 세트 성공</div>
      <div class="summary-card"><strong>${rate}%</strong>달성률</div>
    `;
  }
}

async function toggleCheck(pi, set, day, mi) {
  const p = participants[pi];
  const key = `${p.id}_${SETS[set]}_${DAYS[day]}`;
  if(!checksData[key]) checksData[key] = {m0:false,m1:false,m2:false,m3:false};
  checksData[key][MISSION_KEYS[mi]] = !checksData[key][MISSION_KEYS[mi]];
  renderCheckScreen();
  setStatus('저장 중...','saving');
  try {
    await apiPost({action:'saveCheck', id:p.id, week:SETS[set], day:DAYS[day],
      m0:!!checksData[key].m0, m1:!!checksData[key].m1,
      m2:!!checksData[key].m2, m3:!!checksData[key].m3});
    setStatus('저장됨 ✓','connected');
  } catch(e) { setStatus('저장 실패','error'); }
}

async function addParticipant() {
  const name = prompt('참가자 이름을 입력하세요');
  if(!name) return;
  const custom = prompt('개인 미션을 입력하세요') || '개인 미션';
  setStatus('저장 중...','saving');
  try {
    const res = await apiPost({action:'addParticipant', name, custom});
    participants.push({id:res.id, name, custom, status:'활성'});
    renderCheckScreen();
    setStatus('참가자 추가됨 ✓','connected');
  } catch(e) { setStatus('저장 실패','error'); }
}

function renderParticipants() {
  const list = currentView === 'mine'
    ? [{p:participants[selectedPi], pi:selectedPi}]
    : participants.map((p,pi) => ({p,pi}));

  document.getElementById('participantsGrid').innerHTML = list.map(({p,pi}) => {
    const col = COLORS[pi%COLORS.length];
    const setDone = DAYS.filter((_,di) => isDayDone(p.id, currentSet, di)).length;
    const totalChecks = DAYS.reduce((a,_,di) => {
      const row = checksData[`${p.id}_${SETS[currentSet]}_${DAYS[di]}`];
      return a + (row ? [row.m0,row.m1,row.m2,row.m3].filter(Boolean).length : 0);
    }, 0);
    const pct = Math.round(totalChecks / 12 * 100);
    const success = isSetSuccess(p.id, currentSet);
    const statusText = success ? '🎉 세트 성공!' : setDone > 0 ? `${setDone}/3일 완료` : '미시작';
    const statusClass = success ? 'status-success' : setDone > 0 ? 'status-ongoing' : 'status-fail';
    const missionNames = [...MISSION_NAMES, p.custom||'개인미션'];

    const thCols = DAYS.map(d => `<th style="font-size:12px;padding-bottom:8px">${d}</th>`).join('');
    const missionRows = MISSION_ICONS.map((icon,mi) => {
      const cells = DAYS.map((_,di) => {
        const checked = getCheck(p.id, currentSet, di, mi);
        return `<td><button class="check-btn${checked?' checked':''}" title="${missionNames[mi]}" onclick="toggleCheck(${pi},${currentSet},${di},${mi})"></button></td>`;
      }).join('');
      return `<tr><td class="icon-cell">${icon}</td>${cells}</tr>`;
    }).join('');

    const indicatorCells = DAYS.map((_,di) => {
      const done = isDayDone(p.id, currentSet, di);
      const row = checksData[`${p.id}_${SETS[currentSet]}_${DAYS[di]}`];
      const any = row && [row.m0,row.m1,row.m2,row.m3].some(Boolean);
      const cls = done ? 'done' : any ? 'partial' : '';
      return `<td class="indicator-cell"><div class="day-dot ${cls}"></div></td>`;
    }).join('');

    return `<div class="participant-card">
      <div class="participant-header">
        <div class="avatar" style="background:${col.bg};color:${col.text}">${p.name.slice(0,1)}</div>
        <div>
          <div class="participant-name">${p.name}</div>
          <div class="custom-label">⭐ ${p.custom||'개인미션'}</div>
        </div>
        <div class="status-badge ${statusClass}">${statusText}</div>
      </div>
      <table class="check-table">
        <thead><tr><th></th>${thCols}</tr></thead>
        <tbody>${missionRows}<tr><td></td>${indicatorCells}</tr></tbody>
      </table>
      <div class="bar-section">
        <div class="bar-label"><span>${currentSet+1}세트 달성률</span><span>${pct}%</span></div>
        <div class="bar-track"><div class="${pct>=100?'bar-fill':'bar-fill partial'}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
